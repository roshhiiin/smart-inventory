# Render.com blueprint: one web service serving the API and the web app, with a persistent disk for the database
services:
  - type: web
    name: stockroom
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
    disk: {name: data, mountPath: /data, sizeGB: 1}
